<!doctype html>
<meta charset="utf-8">
<title>OpenDIAlyzer</title>
<link rel="stylesheet" href="style.css">
<style>
  /* App-only additions on top of the mockup's stylesheet. */
  body{overflow:hidden}
  .app{border:0;border-radius:0;box-shadow:none;height:100vh;display:flex;flex-direction:column}
  .titlebar{-webkit-app-region:drag;padding-left:78px}
  .titlebar button,.titlebar .chip{-webkit-app-region:no-drag}
  .panes{flex:1;min-height:0;grid-template-columns:250px minmax(0,1fr) minmax(0,1.05fr)}
  /* A grid item defaults to min-height:auto, so the pane sized itself to its
     content — 7.8 million pixels of virtual rows — and the scroller never
     scrolled, because it was never smaller than what it held. */
  .pane{min-height:0;overflow:hidden}
  .pane-body{overscroll-behavior:contain}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;height:100%;color:var(--muted);text-align:center;padding:32px}
  .empty .omslogo{width:120px;color:var(--ink);opacity:.9}
  .empty p{max-width:44ch;font-size:12.5px;margin:0}
  tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--accent-line)}
  /* Virtualised list: a fixed row height is what makes scroll position and row
     index interchangeable. Keep this in step with ROW_H in renderer.js. */
  tbody tr{height:29px}
  tbody td{padding-top:0;padding-bottom:0;line-height:29px}
  tbody tr.spacer{height:auto;cursor:default;background:none}
  tbody tr.spacer:hover{background:none}
  tbody tr.spacer td{padding:0;border:0}
  thead th{position:sticky;top:0;z-index:2}
  .scroller{position:relative;overflow:auto;flex:1;min-height:0}
  .note-inline{font-size:11.5px;color:var(--muted);margin:10px 0 0}
  .err{color:var(--crit)}
  .busy{opacity:.5;transition:opacity .12s}
  .presence{display:flex;flex-wrap:wrap;gap:6px}
  .prun{display:flex;flex-direction:column;gap:1px;align-items:flex-start;
    border:1px solid var(--line);border-radius:7px;padding:5px 9px;background:var(--panel);
    font:inherit;text-align:left;min-width:112px}
  .prun .pname{font-size:11px;font-weight:560}
  .prun .pdetail{font-size:10px;color:var(--muted)}
  .prun.hit{border-color:var(--good)}
  .prun.hit .pname{color:var(--good)}
  /* A missing run with raw data is the actionable case — question 2. */
  .prun.miss{border-color:var(--warn);border-style:dashed;cursor:pointer}
  .prun.miss .pname{color:var(--warn)}
  .prun.miss:hover{background:color-mix(in srgb,var(--warn) 12%,transparent)}
  .prun.noraw{border-color:var(--line);opacity:.5;cursor:default}
  .prun.noraw .pname{color:var(--muted)}
  .muted{color:var(--muted);font-size:11.5px}
  /* Product lockup: the OpenMS mark is the ecosystem badge, the wordmark is
     ours. DIA is picked out in the gradient, matching the application icon. */
  .product{font-size:13px;font-weight:640;letter-spacing:-.015em;white-space:nowrap}
  .product .dia{background:linear-gradient(90deg,var(--oms-magenta),var(--oms-purple));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .tsep{width:1px;align-self:stretch;margin:5px 2px;background:var(--line)}
  /* Eight columns have to fit ~800 px; the scroller still catches the overflow
     at narrow widths, but at the default size nothing should be clipped. */
  tbody td, thead th{padding-left:7px;padding-right:7px}
  td.seq-cell{max-width:210px;overflow:hidden;text-overflow:ellipsis}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{color:var(--ink)}
  thead th.sorted{color:var(--accent)}
  thead tr.filters th{padding:0 4px 4px;border-bottom:1px solid var(--line);
    position:sticky;top:29px;z-index:2;background:var(--panel)}
  thead tr.filters input{width:100%;box-sizing:border-box;border:1px solid var(--line);
    border-radius:5px;background:var(--sunk);color:var(--ink);
    font:inherit;font-size:11px;padding:2px 5px;min-width:0}
  thead tr.filters input::placeholder{color:var(--muted);opacity:.65}
  thead tr.filters input.on{border-color:var(--accent-line);color:var(--accent)}
</style>

<div class="app">
  <div class="titlebar">
    <svg class="omslogo" viewBox="0 0 841.89 595.28" role="img" aria-label="OpenMS"><use href="#oms-logo"/></svg>
    <span class="tsep"></span>
    <div class="product">Open<span class="dia">DIA</span>lyzer</div>
    <span class="tsep"></span>
    <div class="name" id="sessionName">No session</div>
    <div class="ctx mono" id="sessionCtx">Open a report to begin</div>
    <div class="spacer"></div>
    <span class="chip" id="archiveChip" hidden></span>
    <button class="chip engine diann" id="engineChip">◆ DIA-NN</button>
    <button class="act" id="openBtn">Open report…</button>
  </div>

  <div class="panes">
    <section class="pane" aria-label="Scope">
      <div class="pane-head"><span class="eyebrow">Scope</span></div>
      <div class="pane-body">
        <label class="search">
          <span aria-hidden="true" style="color:var(--muted)">⌕</span>
          <input id="q" placeholder="peptide, gene, protein…" aria-label="Interrogate">
          <kbd>⌘K</kbd>
        </label>

        <div class="grp">
          <span class="eyebrow">Runs</span>
          <ul class="runlist" id="runs" role="listbox" aria-label="Runs"></ul>
        </div>

        <div class="grp">
          <span class="eyebrow">Confidence</span>
          <div class="slider-row" style="margin-top:8px">
            <span>precursor q ≤</span><b class="mono" id="fdrOut">0.010</b>
          </div>
          <input type="range" id="fdr" min="0" max="100" value="50" aria-label="q-value threshold">
          <div class="toggles">
            <label class="tg"><input type="checkbox" id="proteotypic"> proteotypic only</label>
            <label class="tg"><input type="checkbox" id="hidedecoy" checked> hide decoys</label>
          </div>
        </div>

        <div class="card" id="sessionCard" hidden>
          <dl id="sessionDl"></dl>
        </div>
      </div>
    </section>

    <section class="pane" aria-label="Matches">
      <div class="pane-head">
        <div class="grain" role="group" aria-label="Grain">
          <button data-grain="precursors" aria-pressed="true">Precursors</button>
          <button data-grain="proteins" aria-pressed="false">Proteins</button>
          <button data-grain="runs" aria-pressed="false">Runs</button>
        </div>
      </div>
      <div class="scroller" id="scroller">
        <table id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
      </div>
      <div class="tablefoot">
        <span class="mono" id="count">—</span>
        <span class="spacer"></span>
        <span>↑↓ to step</span>
      </div>
    </section>

    <section class="pane" aria-label="Evidence">
      <div class="pane-head">
        <span class="eyebrow">Evidence</span>
        <span class="spacer"></span>
        <span class="eyebrow" id="evsrc"></span>
      </div>
      <div class="pane-body" id="ev">
        <div class="empty">
          <svg class="omslogo" viewBox="0 0 841.89 595.28" role="img" aria-label="OpenMS"><use href="#oms-logo"/></svg>
          <p>Open a <span class="mono">report.parquet</span> from DIA-NN or
             OpenDIAlyzer. Point it at the matching
             <span class="mono">.mzpeak</span> and every chart below becomes a
             live read into the raw data.</p>
        </div>
      </div>
    </section>
  </div>
</div>
